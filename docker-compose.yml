services:

  # ── Kafka (KRaft mode) ───────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - predictive-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - predictive-net

  # ── Spark Master ─────────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
    volumes:
      - ./data:/opt/spark/data
      - ./streaming:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
      - delta_lake:/opt/spark/delta
    networks:
      - predictive-net

  # ── Spark Worker ─────────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 3
    depends_on:
      - spark-master
    volumes:
      - ./data:/opt/spark/data
      - ./streaming:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
      - delta_lake:/opt/spark/delta
    networks:
      - predictive-net

  # ── MLflow ───────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - predictive-net

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: failure-predictor
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      - mlflow
    networks:
      - predictive-net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-predictive.rule=Host(`3o9bqyabjplefuacz5tvrlnp.37.60.244.164.sslip.io`)"
      - "traefik.http.routers.api-predictive.entrypoints=http"
      - "traefik.http.services.api-predictive.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-predictive.service=api-predictive"

volumes:
  kafka_data:
  spark_checkpoints:
  delta_lake:
  mlflow_data:

networks:
  predictive-net:
    driver: bridge
  coolify:
    external: true
